<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./Assets/images/favicon-32x32.png">
  <title>Product list with cart</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <section class="dessert" id="dessert">
    <h2 class="heading">Desserts</h2>
    <div class="dessert-container" id="dessert-container">
      <!-- Products will be loaded here dynamically -->
    </div>
  </section>
  
  <section id="cart-container" class="cart">
    <h2 class="heading">Your Cart <span id="info-cart">(0)</span></h2>
    <div class="cart-empty">
      <img src="Assets/images/illustration-empty-cart.svg" alt="Empty Cart" class="empty-cart-img">
      <p class="empty-cart-text">Your added items will appear here</p>
    </div>
    <div class="cart-items" style="display: none;">
      <!-- Items will appear here dynamically -->
    </div>
    <div class="cart-summary" style="display: none;">
      <div class="cart-summary-row">
        <span class="cart-summary-label">Order Total</span>
        <span class="cart-total">$0.00</span>
      </div>
      <div class="carbon-neutral-notice">
        <img src="Assets/images/icon-carbon-neutral.svg" alt="">
        <span>This is a <strong>carbon-neutral</strong> delivery</span>
      </div>
      <button class="confirm-order-btn" tabindex="0">Confirm Order</button>
      <button class="reset-order-btn" tabindex="0">Start New Order</button>
    </div>
  </section>

  <!-- Confirm Order Modal -->
  <div id="confirm-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <img src="Assets/images/icon-order-confirmed.svg" alt="" class="modal-check-icon">
        <h2 id="modal-title">Order Confirmed</h2>
        <p class="modal-subtitle">We hope you enjoy your food!</p>
      </div>
      <div class="modal-items" id="modal-items">
        <!-- Items will be populated dynamically -->
      </div>
      <div class="modal-total-row">
        <span class="modal-total-label">Order Total</span>
        <span class="modal-total" id="modal-total">$0.00</span>
      </div>
      <button class="modal-reset-btn" tabindex="0">Start New Order</button>
    </div>
  </div>

  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">HERU DELIANSYAH</a>.
  </div> -->
  
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
